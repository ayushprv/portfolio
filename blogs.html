<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gallery — ayush yadav</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#fdfbf7; --ink:#201e1b; --muted:#716a63; --line:#e4ddd5; --accent:#a06648; }
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Mono",monospace} a{color:inherit;text-decoration:none}
.site{width:min(100% - 40px,1060px);margin:0 auto;padding:28px 0 64px}.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.04em}.topbar nav{display:flex;gap:20px;color:var(--muted)}.topbar a:hover{color:var(--accent)}
.intro{margin:clamp(70px,12vw,130px) 0 52px}.kicker,.post-tags{color:var(--accent);font-size:11px;letter-spacing:.09em;text-transform:uppercase}h1{margin:12px 0 0;font-family:"DM Sans",sans-serif;font-size:clamp(3.4rem,9vw,7rem);font-weight:500;letter-spacing:-.08em;line-height:.88}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px}.photo-card{padding-top:12px;border-top:1px solid var(--ink)}.photo-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.88);transition:filter .2s,transform .2s}.photo-card:hover img{filter:saturate(1);transform:translateY(-3px)}.post-title{margin:12px 0 5px;font-family:"DM Sans",sans-serif;font-size:23px;font-weight:500;letter-spacing:-.045em;line-height:1.05}.post-tags{color:var(--muted);font-size:10px}.empty{grid-column:1/-1;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;font-size:13px}
@media(max-width:720px){.site{width:min(100% - 28px,1060px);padding-top:20px}.gallery-grid{grid-template-columns:1fr;gap:34px}.photo-card img{aspect-ratio:16/9}}
</style>
</head>
<body>
<main class="site">
<header class="topbar"><a href="/">AYUSH / NOTES</a><nav><a href="/">home</a><a href="/writings.html">writings</a><a href="mailto:ayushyadavprv">mail</a></nav></header>
<section class="intro"><div class="kicker">photo gallery</div><h1>gallery</h1></section>
<section class="gallery-grid" id="gallery" aria-live="polite">
  <article class="photo-card"><img src="https://u.cubeupload.com/ayushyadavprv/IMG20260822110552694.jpg" alt="The Taj Mahal"><h2 class="post-title">and then, the TAJ</h2></article>
  <article class="photo-card"><img src="https://u.cubeupload.com/ayushyadavprv/2.jpg" alt="Delhi"><h2 class="post-title">before delhi woke</h2></article>
  <article class="photo-card"><img src="https://u.cubeupload.com/ayushyadavprv/IMG20251223132546817.jpg" alt="A New Year trek"><h2 class="post-title">i walked into the new year</h2></article>
</section>
</main>
<script>
(async () => {
  const gallery = document.getElementById("gallery");
  try {
    const response = await fetch("/content/gallery.json", { cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    const entries = Array.isArray(data.entries) ? data.entries : [];
    if (!entries.length) return;
    const items = entries.sort((a,b) => new Date(b.date||0)-new Date(a.date||0)).flatMap(post =>
      (Array.isArray(post.photos) ? post.photos : []).map(photo => ({ post, photo }))
    );
    if (!items.length) return;
    const fragment = document.createDocumentFragment();
    items.forEach(({post, photo}) => {
      const article = document.createElement("article"); article.className = "photo-card";
      const image = document.createElement("img"); image.src = photo.image; image.alt = photo.alt || post.title || "Gallery photo";
      const title = document.createElement("h2"); title.className = "post-title"; title.textContent = post.title || "untitled";
      const tags = document.createElement("div"); tags.className = "post-tags"; tags.textContent = (post.tags || []).join(" · ");
      article.append(image, title, tags); fragment.appendChild(article);
    });
    gallery.prepend(fragment);
  } catch (_) {}
})();
</script>
</body>
</html>
