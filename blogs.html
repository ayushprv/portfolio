<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gallery — ayush yadav</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://i.pinimg.com/736x/b4/be/20/b4be20054573a7917b2e3b7239bfce20.jpg">
<style>
:root { --paper: #fdfbf7; --ink: #201e1b; --muted: #716a63; --line: #e4ddd5; --accent: #a06648; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; }
a { color: inherit; text-decoration: none; }
.site { width: min(100% - 40px, 1060px); margin: 0 auto; padding: 28px 0 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 17px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .04em; }
.topbar nav { display: flex; gap: 20px; color: var(--muted); }
.topbar a:hover { color: var(--accent); }
.intro { margin: clamp(70px, 12vw, 130px) 0 52px; }
.kicker { color: var(--accent); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
h1 { margin: 12px 0 0; font-family: "DM Sans", sans-serif; font-size: clamp(3.4rem, 9vw, 7rem); font-weight: 500; letter-spacing: -.08em; line-height: .88; }
.blog-container { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.blog-box { display: block; padding-top: 12px; border-top: 1px solid var(--ink); }
.blog-image { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(.88); transition: filter .2s ease, transform .2s ease; }
.blog-title { margin-top: 12px; font-family: "DM Sans", sans-serif; font-size: 23px; font-weight: 500; letter-spacing: -.045em; line-height: 1.05; }
.blog-box:hover .blog-image { filter: saturate(1); transform: translateY(-3px); }
@media (max-width: 720px) { .site { width: min(100% - 28px, 1060px); padding-top: 20px; } .blog-container { grid-template-columns: 1fr; gap: 34px; } .blog-image { aspect-ratio: 16 / 9; } }
</style>
</head>
<body>
<main class="site">
  <header class="topbar">
    <a href="https://www.ayushyadav.me/">AYUSH / NOTES</a>
    <nav><a href="https://www.ayushyadav.me/">home</a><a href="https://www.ayushyadav.me/writings.html">writings</a><a href="mailto:ayushyadavprv">mail</a></nav>
  </header>
  <section class="intro"><div class="kicker">photo gallery</div><h1>gallery</h1></section>
  <div class="blog-container">
    <a href="https://www.ayushyadav.me/blogs/2026/and-then-the-taj.html" class="blog-box">
      <img src="https://u.cubeupload.com/ayushyadavprv/IMG20260822110552694.jpg" class="blog-image" alt="The Taj Mahal">
      <div class="blog-title">and then, the TAJ</div>
    </a>
    <a href="https://www.ayushyadav.me/blogs/2026/before-delhi-woke.html" class="blog-box">
      <img src="https://u.cubeupload.com/ayushyadavprv/2.jpg" class="blog-image" alt="Delhi">
      <div class="blog-title">before delhi woke</div>
    </a>
    <a href="https://www.ayushyadav.me/blogs/2026/i-walked-into-the-new-year.html" class="blog-box">
      <img src="https://u.cubeupload.com/ayushyadavprv/IMG20251223132546817.jpg" class="blog-image" alt="A New Year trek">
      <div class="blog-title">i walked into the new year</div>
    </a>
  </div>
</main>
</body>
</html>
