<style>
body{
  font-family: "Poppins",sans-serif;
  margin: 0;
  padding: 0;
}

.top-heading{
  text-align: center;
  font-weight: 700;
}

.nav-links{
    text-align: center;
    margin-bottom: 3%;
}

.nav{

}

.frame{
    display: flex;
    align-items: flex-start;

    padding: 0 5%;
}

.photoframe{

    height: 400px;
    border-radius: 3%;
}

.textbox{
    margin: 0%;

    .frame{
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .photoframe{
        height: auto;
        width: 90%;
        max-width: 350px;
    }

    .textbox{
        padding: 0 20px;
    }
}
.blog-container{
    display: flex;
    justify-content: flex-start;
    gap: 20px;
    padding: 40px 5%;
    flex-wrap: wrap;
}

.blog-box{
    display: block;
    width: 300px;  
    border-radius: 15px;
    overflow: hidden;
    text-decoration: none;
    color: black;
    background: white; 
}

.blog-image{
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.blog-title{
    padding: 12px;
    font-weight: 600;
    font-size: 16px;
