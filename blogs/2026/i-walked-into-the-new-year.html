<style>
body{
  font-family: "Poppins",sans-serif;
  margin: 0;
  padding: 0;
}

.top-heading{
  text-align: center;
  font-weight: 700;
}
.top-para{
    text-align: center;
    margin-right: 10px;
}
.tags{
    text-align: center;
}
.tags span{
    display:inline-block;
    background:#f2f2f2;
    padding:6px 12px;
    margin:4px;
    border-radius:20px;
    font-size:14px;
    
}
.nav-links{
    text-align: center;
    margin-bottom: 3%;
}

.nav{
    margin: 0 10px;
    text-decoration: none;
}
hr{
    border: none;
    height: 1px;
    width: 70%;
    margin: 40px auto;
    background: linear-gradient(to right, transparent, #ccc, transparent);
  }
.writings{
  margin-left: 20px;
}
.banner{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  flex-wrap: wrap;
}

.banner a{
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: all 0.4s ease;
}

.banner a:hover{
  transform: translateY(-8px);
  box-shadow: 0 12px 35px rgba(0,0,0,0.2);
}

.banner img{
  width: 360px;
  height: auto;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 12px;
  transition: all 0.4s ease;
  display: block;
}

.banner a:hover img{
  transform: scale(1.1);
}
.sixteenbynineimg{
  width: auto;
  height: 720px;
  aspect-ratio: 9/16;
  object-fit: cover;
  border-radius: 12px;
}
@media (max-width: 1100px) {
  .banner img{
    width: 300px;
  }
}

@media (max-width: 768px) {
  .banner{
    gap: 15px;
  }
  .banner img{
    width: 260px;
  }
}

@media (max-width: 600px) {

  .banner{
    display: block;
    padding: 0;
  }
}


:root { --paper: #fdfbf7; --ink: #201e1b; --muted: #716a63; --line: #e4ddd5; --accent: #a06648; }
body { background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; }
.top-heading { margin: 0; padding: 34px 20px 0; color: var(--ink); font-family: "DM Sans", sans-serif; font-size: clamp(2.2rem, 6vw, 4.5rem); font-weight: 500; letter-spacing: -.07em; line-height: .95; }
.tags { margin-top: 16px; }
.tags span { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--muted); font-family: "DM Mono", monospace; font-size: 11px; }
hr { width: min(100% - 40px, 1060px); margin: 24px auto 36px; background: var(--line); }
.writings { margin-left: 0; }
.banner { max-width: 1120px; gap: 14px; padding: 0 20px 60px; align-items: flex-start; }
.banner a, .banner img, .sixteenbynineimg { border-radius: 0; box-shadow: none; }
.banner img { filter: saturate(.9); }
.banner a:hover { box-shadow: none; transform: translateY(-3px); }
.banner a:hover img { transform: scale(1.025); filter: saturate(1); }
</style>
