<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Poppins", sans-serif;
  background: #ffffff;
}

header {
  text-align: center;
  padding: 44px 20px 20px;
}

header h1 {
  font-weight: 700;
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  text-transform: lowercase;
  color: #111;
}
.nav-links{
    text-align: center;
    margin-bottom: 3%;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}

.tags span {
  background: #f2f2f2;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}

.tags span:hover { background: #e0e0e0; }

.divider {
  border: none;
  height: 1px;
  width: 70%;
  margin: 36px auto;
  background: linear-gradient(to right, transparent, #ccc, transparent);
}

.masonry {
  column-count: 4;
  column-gap: 10px;
  max-width: 1280px;
  margin: 0 auto 80px;
  padding: 0 10px;
}

.masonry a {
  display: block;
  width: 100%;
  break-inside: avoid;
  margin-bottom: 10px;
  border-radius: 12px;
  overflow: hidden;
  cursor: zoom-in;
}

.masonry a img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
  box-shadow: 0 3px 14px rgba(0,0,0,0.09);
}

.masonry a:hover img {
  transform: scale(1.05);
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
}

.masonry a.landscape img {
  min-height: 220px;
  object-fit: cover;
}

@media (max-width: 1100px) {
  .masonry { column-count: 3; }
}

@media (max-width: 720px) {
  .masonry { column-count: 2; column-gap: 8px; padding: 0 8px; }
  .masonry a { margin-bottom: 8px; }
  .masonry a.landscape img { min-height: 140px; }
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.lightbox.open { display: flex; }

.lightbox img {
  max-width: 92vw;
  max-height: 92vh;
  border-radius: 10px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.lightbox-close {
  position: fixed;
  top: 18px;
  right: 24px;
  color: #fff;
  font-size: 32px;
  cursor: pointer;
  line-height: 1;
  opacity: 0.8;
  transition: opacity 0.2s;
}

.lightbox-close:hover { opacity: 1; }


.home-btn {
  position: fixed;
  top: 18px;
  left: 22px;
  z-index: 500;
  width: 40px;
  height: 40px;
  background: #f2f2f2;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.home-btn:hover {
  background: #e0e0e0;
  transform: scale(1.08);
  box-shadow: 0 4px 14px rgba(0,0,0,0.13);
}

.home-btn svg {
  width: 18px;
  height: 18px;
  fill: #111;
}

@media (max-width: 720px) {
  .home-btn {
    top: 14px;
    left: 14px;
    width: 34px;
    height: 34px;
  }
  .home-btn svg {
    width: 15px;
    height: 15px;
  }
}

.popup-overlay {
  display: flex;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}

.popup-overlay.hidden { display: none; }

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.popup {
  background: #fff;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  padding: 36px 32px 32px;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1);
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.popup-close {
  position: absolute;
  top: 14px;
  right: 18px;
  font-size: 22px;
  color: #aaa;
  cursor: pointer;
  line-height: 1;
  transition: color 0.2s;
  background: none;
  border: none;
  font-family: inherit;
}

.popup-close:hover { color: #111; }

.popup-logo {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #f2f2f2;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  overflow: hidden;
  border: 2px solid #eee;
}

.popup-logo img {
  width: 38px;
  height: 38px;
  object-fit: contain;
}

.popup h2 {
  text-align: center;
  font-size: 1.15rem;
  font-weight: 700;
  color: #111;
  text-transform: lowercase;
  margin-bottom: 8px;
}

.popup p {
  text-align: center;
  font-size: 13px;
  color: #777;
  line-height: 1.6;
  margin-bottom: 22px;
}

.popup-input-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.popup-input-row input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #e0e0e0;
  border-radius: 10px;
  font-family: "Poppins", sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  color: #111;
}

.popup-input-row input:focus { border-color: #111; }

.popup-input-row button {
  width: 100%;
  padding: 13px 18px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: "Poppins", sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}

.popup-input-row button:hover { background: #333; transform: scale(1.03); }
.popup-input-row button:disabled { background: #aaa; cursor: not-allowed; transform: none; }

@media (min-width: 480px) {
  .popup-input-row {
    flex-direction: row;
  }
  .popup-input-row input {
    flex: 1;
    width: auto;
    font-size: 13px;
    padding: 11px 14px;
  }
  .popup-input-row button {
    width: auto;
    font-size: 13px;
    padding: 11px 18px;
  }
}

.popup-msg {
  text-align: center;
  font-size: 13px;
  margin-top: 14px;
  min-height: 18px;
  color: #2e7d32;
}

.popup-msg.error { color: #c62828; }

.popup-skip {
  text-align: center;
  margin-top: 14px;
  font-size: 12px;
  color: #bbb;
  cursor: pointer;
  transition: color 0.2s;
}

.popup-skip:hover { color: #888; }

/* Warm-white notebook theme */
:root { --paper: #fdfbf7; --ink: #201e1b; --muted: #716a63; --line: #e4ddd5; --accent: #a06648; }
body { background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; }
header { padding: 34px 20px 18px; border-bottom: 1px solid var(--line); }
header h1 { color: var(--ink); font-family: "DM Sans", sans-serif; font-weight: 500; letter-spacing: -.06em; }
.tags { margin-top: 16px; }
.tags span { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--muted); font-family: "DM Mono", monospace; font-size: 11px; }
.tags span:hover { background: #f4eee7; }
.divider { width: min(100% - 40px, 1060px); margin: 18px auto 36px; background: var(--line); }
.masonry { max-width: 1120px; column-gap: 14px; padding: 0 20px; }
.masonry a, .masonry a img { border-radius: 0; }
.masonry a img { box-shadow: none; filter: saturate(.9); }
.masonry a:hover img { box-shadow: none; transform: scale(1.025); filter: saturate(1); }
.home-btn { background: var(--paper); border: 1px solid var(--line); border-radius: 0; box-shadow: none; }
.home-btn:hover { background: #f4eee7; box-shadow: none; transform: none; }
.home-btn svg { fill: var(--ink); }
.popup-overlay { background: rgba(32,30,27,.35); }
.popup { background: var(--paper); border: 1px solid var(--line); border-radius: 0; box-shadow: 0 18px 50px rgba(48,38,30,.12); }
.popup-close { color: var(--muted); }
.popup-close:hover { color: var(--ink); }
.popup-logo { border: 1px solid var(--line); border-radius: 0; background: #f4eee7; }
.popup h2 { color: var(--ink); font-family: "DM Sans", sans-serif; font-weight: 500; }
.popup p, .popup-skip { color: var(--muted); }
.popup-input-row input { border-color: var(--line); border-radius: 0; background: #fffefa; color: var(--ink); font-family: "DM Mono", monospace; }
.popup-input-row input:focus { border-color: var(--accent); }
.popup-input-row button { border-radius: 0; background: var(--ink); font-family: "DM Mono", monospace; font-weight: 500; }
.popup-input-row button:hover { background: var(--accent); transform: none; }
.popup-msg { color: #6a7652; }
.lightbox { background: rgba(32,30,27,.92); }
.lightbox img { border-radius: 0; }
</style>
</head>

      <input type="email" id="emailInput" placeholder="your@email.com">

  <img src="" id="lbImg" alt="">
</div>

<script>
  const overlay      = document.getElementById('popupOverlay');
  const popupClose   = document.getElementById('popupClose');
  const popupSkip    = document.getElementById('popupSkip');
  const subscribeBtn = document.getElementById('subscribeBtn');
  const emailInput   = document.getElementById('emailInput');
  const popupMsg     = document.getElementById('popupMsg');

  function closePopup() { overlay.classList.add('hidden'); }
  popupClose.addEventListener('click', closePopup);
  if (popupSkip) popupSkip.addEventListener('click', closePopup);

  subscribeBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!re.test(email)) {
      popupMsg.textContent = 'please enter a valid email.';
      popupMsg.className = 'popup-msg error';
      return;
    }
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'sending…';
    fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
      .then(async response => {
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Could not subscribe you.');
        popupMsg.textContent = data.alreadySubscribed ? 'you’re already on the list.' : 'you’re in — check your inbox.';
        popupMsg.className = 'popup-msg';
        setTimeout(closePopup, 1500);
      })
      .catch(error => {
        popupMsg.textContent = error.message || 'Could not subscribe you right now.';
        popupMsg.className = 'popup-msg error';
      })
      .finally(() => {
        subscribeBtn.disabled = false;
        subscribeBtn.textContent = 'notify me';
      });
  });

  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') subscribeBtn.click(); });


  const feed    = document.getElementById('feed');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');

  feed.querySelectorAll('img').forEach(img => {
    const detect = () => {
      const r = img.naturalWidth / img.naturalHeight;
      if (r >= 1.15) {
        img.closest('a').classList.add('landscape');
      }
    };
    if (img.complete && img.naturalWidth) detect();
    else img.addEventListener('load', detect);
  });

  feed.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      lbImg.src = a.dataset.src;
      lightbox.classList.add('open');
    });
  });

  lbClose.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) lightbox.classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });
</script>
