<link rel="icon" type="image/png" href="https://i.pinimg.com/736x/b4/be/20/b4be20054573a7917b2e3b7239bfce20.jpg">
<style>
:root { --paper: #fdfbf7; --ink: #201e1b; --muted: #716a63; --line: #e4ddd5; --accent: #a06648; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; }
a { color: inherit; text-decoration: none; }
.site { width: min(100% - 40px, 1060px); margin: 0 auto; padding: 28px 0 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 17px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .04em; }
.topbar nav { display: flex; gap: 20px; color: var(--muted); }
.topbar a:hover, .read:hover { color: var(--accent); }
.prompt { margin: clamp(72px, 14vw, 150px) 0 14px; color: var(--accent); font-size: 13px; }
h1 { max-width: 670px; margin: 0; font-family: "DM Sans", sans-serif; font-size: clamp(3rem, 8vw, 6.5rem); font-weight: 500; letter-spacing: -.075em; line-height: .9; }
.intro { max-width: 510px; margin: 28px 0 64px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.featured { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 390px); gap: 28px; align-items: end; padding-top: 16px; border-top: 1px solid var(--ink); }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.featured h2 { margin: 12px 0; font-family: "DM Sans", sans-serif; font-size: clamp(2rem, 4vw, 3.8rem); font-weight: 500; letter-spacing: -.065em; line-height: .95; }
.featured p { max-width: 360px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.read { display: inline-block; margin-top: 26px; font-size: 12px; }
.featured img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(.9); }
@media (max-width: 680px) { .site { width: min(100% - 28px, 1060px); padding-top: 20px; } .featured { grid-template-columns: 1fr; } .featured img { order: -1; } }
</style>
</head>
<body>
<main class="site">
  <header class="topbar">
    <a href="https://www.ayushyadav.me/">AYUSH / NOTES</a>
    <nav><a href="https://www.ayushyadav.me/gallery.html">gallery</a><a href="https://www.ayushyadav.me/writings.html">writings</a><a href="https://mail.google.com/mail/?view=cm&fs=1&to=ayushyadavprv%40gmail.com">mail</a></nav>
  </header>

  <article class="featured">
    <div>
      <div class="eyebrow">latest note</div>
      <h2>drapetomania</h2>
      <p>they call it “running away” when really it’s just refusing to stay stuck.</p>
      <a class="read" href="https://www.ayushyadav.me/gallery/2026/i-walked-into-the-new-year.html">read the note →</a>
    </div>
    <a href="https://www.ayushyadav.me/gallery/2026/i-walked-into-the-new-year.html"><img src="https://u.cubeupload.com/ayushyadavprv/Drapetomania2.png" alt="Drapetomania"></a>
  </article>
</main>
</body>
